<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <style>
      body {
        background: #f5f7fb;
      }
      .profile-card {
        max-width: 500px;
        margin: 60px auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 15px;
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <img src="imgs/default_profile.png" class="profile-img" alt="Profile" />

      <h4 class="text-center">My Profile</h4>

      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" id="full_name" class="form-control" />
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" disabled />
      </div>

      <button class="btn btn-primary w-100 mb-3" onclick="updateProfile()">
        Update Profile
      </button>

      <hr />

      <h5>Change Password</h5>

      <div class="mb-2">
        <input
          type="password"
          id="old_password"
          class="form-control"
          placeholder="Old Password"
        />
      </div>

      <div class="mb-2">
        <input
          type="password"
          id="new_password"
          class="form-control"
          placeholder="New Password"
        />
      </div>

      <button class="btn btn-warning w-100" onclick="changePassword()">
        Change Password
      </button>

      <div id="msg" class="mt-3 text-center"></div>
    </div>

    <script src="profile.js"></script>
  </body>
</html>
