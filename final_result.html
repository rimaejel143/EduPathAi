<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your Final Major Recommendation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f7fb;
        font-family: "Segoe UI", sans-serif;
      }
      .card-wrap {
        background: #fff;
        border-radius: 24px;
        padding: 50px 70px;
        margin: 50px auto;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        max-width: 1200px;
      }
      .major-name {
        font-size: 3rem;
        font-weight: 800;
        color: #183a5d;
      }
      .confidence {
        background: #ffd11a;
        padding: 10px 22px;
        border-radius: 30px;
        font-weight: 700;
        display: inline-block;
        margin-top: 10px;
      }
      .pie {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: conic-gradient(
          #183a5d 0 120deg,
          #ff6b6b 120deg 240deg,
          #ffd94d 240deg 360deg
        );
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
      }
      .legend div {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 0.95rem;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
      .logic {
        background: #183a5d;
      }
      .creativity {
        background: #ff6b6b;
      }
      .social {
        background: #ffd94d;
      }
    </style>
  </head>

  <body>
    <div class="card-wrap">
      <div id="loading" class="text-center fw-bold">
        Calculating your results...
      </div>

      <div id="result" style="display: none">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h5>Congratulations! Your Recommended Path Is:</h5>
            <div class="major-name" id="major"></div>
            <div class="confidence" id="confidence"></div>

            <p class="text-muted mt-3">
              Unlock your potential in the world of information and analysis.
            </p>

            <!-- ✅ Download PDF -->
            <button class="btn btn-dark px-4 py-2 mt-3" onclick="exportPDF()">
              Download My Career Report
            </button>
          </div>

          <div class="col-md-6 text-center">
            <div class="pie mx-auto" id="pie"></div>

            <div class="legend mt-4 text-start d-inline-block">
              <div>
                <span class="dot logic"></span> Logic: <b id="l1">0</b>%
              </div>
              <div>
                <span class="dot creativity"></span> Creativity:
                <b id="l2">0</b>%
              </div>
              <div>
                <span class="dot social"></span> Social: <b id="l3">0</b>%
              </div>
            </div>
          </div>
        </div>

        <!-- ✅ Finish -->
        <div class="text-center mt-4">
          <button
            class="btn btn-outline-primary px-5"
            onclick="location.href='php/student/student_dashboard.php'"
          >
            Finish
          </button>
        </div>
      </div>
    </div>

    <!-- ✅ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
      async function loadResult() {
        try {
          const res = await fetch("php/assessment/final_result.php", {
            cache: "no-store",
          });
          const data = await res.json();

          console.log("Final result response:", data); // DEBUG

          // ❌ حماية
          if (!data.success || !data.major) {
            document.getElementById("major").innerText = "Calculating...";
            document.getElementById("confidence").innerText = "";
            return;
          }

          document.getElementById("loading").style.display = "none";
          document.getElementById("result").style.display = "block";

          // ✅ Major
          document.getElementById("major").innerText = data.major;

          // ✅ Confidence (safe)
          const confidence = Number(data.confidence);
          document.getElementById("confidence").innerText = confidence
            ? "Confidence: " + Math.round(confidence) + "%"
            : "";

          // ✅ Scores (safe)
          const scores = Array.isArray(data.raw_scores)
            ? data.raw_scores.map(Number)
            : [0, 0, 0];

          const [a, b, c] = scores;
          const total = a + b + c || 1;

          const pa = Math.round((a / total) * 100);
          const pb = Math.round((b / total) * 100);
          const pc = 100 - pa - pb;

          l1.innerText = pa;
          l2.innerText = pb;
          l3.innerText = pc;

          pie.style.background = `conic-gradient(
        #183a5d 0 ${pa * 3.6}deg,
        #ff6b6b ${pa * 3.6}deg ${(pa + pb) * 3.6}deg,
        #ffd94d ${(pa + pb) * 3.6}deg 360deg
      )`;
        } catch (e) {
          console.error("Load result error:", e);
        }
      }

      loadResult();

      /* ✅ PDF of FULL PAGE */
      async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "mm", "a4");
        const canvas = await html2canvas(document.querySelector(".card-wrap"), {
          scale: 2,
        });
        const img = canvas.toDataURL("image/jpeg", 1);
        pdf.addImage(img, "JPEG", 10, 10, 190, 0);
        pdf.save("career_report.pdf");
      }
    </script>
  </body>
</html>
