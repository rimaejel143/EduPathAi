<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <h2>Reset Your Password</h2>
      <div id="notice" style="color: red"></div>
      <form id="reset-form">
        <div>
          <label>New password</label>
          <input type="password" id="new_password" required minlength="6" />
        </div>
        <div>
          <label>Confirm password</label>
          <input type="password" id="confirm_password" required minlength="6" />
        </div>
        <div>
          <button type="submit">Set New Password</button>
        </div>
      </form>
      <div id="success" style="display: none; color: green">
        Password reset complete. You may now <a href="sign_in.html">sign in</a>.
      </div>
    </div>

    <script>
      // Parse token from query string
      function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      const token = getQueryParam("token");
      const form = document.getElementById("reset-form");
      const notice = document.getElementById("notice");
      const success = document.getElementById("success");

      if (!token) {
        notice.innerText = "Missing reset token.";
        form.style.display = "none";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        notice.innerText = "";
        const a = document.getElementById("new_password").value;
        const b = document.getElementById("confirm_password").value;
        if (a !== b) {
          notice.innerText = "Passwords do not match.";
          return;
        }

        try {
          const res = await fetch("php/auth/reset_password.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, new_password: a }),
            cache: "no-store",
          });
          const data = await res.json();
          if (!data.success) {
            notice.innerText = data.message || "Failed to reset password.";
            return;
          }
          form.style.display = "none";
          success.style.display = "block";
        } catch (err) {
          notice.innerText = "System error.";
        }
      });
    </script>
  </body>
</html>
