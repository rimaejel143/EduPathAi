<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forum Post</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f5f8fb;
      }
      .wrap {
        max-width: 900px;
        margin: 40px auto;
      }
      .reply {
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container wrap">
      <div class="mb-3">
        <a class="btn btn-outline-secondary" href="forum.html">Back to Forum</a>
      </div>

      <div class="card p-3 mb-3">
        <h3 id="postTitle"></h3>
        <div class="text-muted mb-2" id="postMeta"></div>
        <p id="postBody"></p>
      </div>

      <div class="card p-3 mb-3">
        <h5>Replies</h5>
        <div id="replies"></div>
      </div>

      <div class="card p-3">
        <h5>Add a reply</h5>
        <form id="replyForm">
          <div class="mb-2">
            <textarea id="replyBody" class="form-control" rows="4"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Reply</button>
        </form>
      </div>
    </div>

    <script src="forum.js"></script>
  </body>
</html>
