<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Forum</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f5f8fb;
      }
      .forum-wrap {
        max-width: 1100px;
        margin: 40px auto;
      }
      .category-list {
        max-height: 400px;
        overflow: auto;
      }
      .post-card {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container forum-wrap">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Student Forum</h2>
        <a class="btn btn-outline-secondary" href="index.html">Back</a>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="card p-3 mb-3">
            <h5>Categories</h5>
            <div id="categories" class="list-group category-list"></div>
          </div>

          <div class="card p-3">
            <h5>Create Post</h5>
            <form id="createPostForm">
              <div class="mb-2">
                <label class="form-label">Category</label>
                <select id="postCategory" class="form-select"></select>
              </div>
              <div class="mb-2">
                <label class="form-label">Title</label>
                <input id="postTitle" class="form-control" />
              </div>
              <div class="mb-2">
                <label class="form-label">Body</label>
                <textarea
                  id="postBody"
                  class="form-control"
                  rows="4"
                ></textarea>
              </div>
              <button class="btn btn-primary" type="submit">Create</button>
            </form>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card p-3 mb-3">
            <div class="d-flex justify-content-between">
              <h5 id="postsTitle">Recent Posts</h5>
              <div>
                <button id="refreshBtn" class="btn btn-sm btn-outline-primary">
                  Refresh
                </button>
              </div>
            </div>
            <div id="posts" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="forum.js"></script>
  </body>
</html>
