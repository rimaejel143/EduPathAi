<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Part 1: Personality Analysis</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .top-header {
        height: 70px;
        background: var(--primary-blue);
        color: #3b72a0;
        padding: 10px 25px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 30px;
        position: relative;
        z-index: 1;
      }

      body {
        background-color: #f5f8fb;
      }

      .quiz-wrapper {
        background: #ffffff;
        border-radius: 25px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        padding: 50px;
        margin: 60px auto;
        width: 90%;
        max-width: 1200px;
        position: relative;
        z-index: 10;
      }

      h2 {
        text-align: center;
        font-weight: 800;
        color: #3b72a0;
        margin-bottom: 25px;
      }

      .separator {
        width: 100%;
        height: 5px;
        background: #e6eef5;
        border-radius: 50px;
        margin-bottom: 45px;
      }

      .options-row {
        display: flex;
        justify-content: space-between;
        text-align: center;
        gap: 10px;
        margin-top: 40px;
      }

      .answer-btn {
        width: 180px;
        padding: 25px 10px;
        background: #ffffff;
        border-radius: 15px;
        border: 2px solid #d6e0eb;
        font-size: 20px;
        transition: 0.2s;
        cursor: pointer;
      }

      .answer-btn.active {
        background: #3b72a0;
        color: white;
        border-color: #3b72a0;
      }

      .nav-buttons {
        margin-top: 45px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn-prev {
        background: #7a8590;
        padding: 15px 40px;
        border-radius: 40px;
        color: white;
        font-size: 20px;
        font-weight: 600;
        border: none;
      }

      .btn-next {
        background: #ff8500;
        padding: 15px 40px;
        border-radius: 40px;
        color: white;
        font-size: 20px;
        font-weight: 700;
        border: none;
      }

      .btn-next:hover {
        background: #ff9c33;
      }
      .btn-prev:hover {
        background: #626f78;
      }
    </style>
  </head>

  <body>
    <div class="top-header">
      <nav class="navbar navbar-light bg-transparent px-4">
        <div class="ms-auto">
          <a href="php/student/student_dashboard.php" class="me-2">
            <img
              src="/SeniorEducation/SeniorEducation/imgs/default_profile.png"
              width="35"
              height="35"
              class="rounded-circle border border-light"
              style="object-fit: cover"
              alt="Profile"
            />
          </a>
        </div>
      </nav>

      <a href="index.html" style="text-decoration: none; color: inherit"
        >Edu<span style="color: #ff8500">PathAI</span></a
      >
      <div id="counter">Question 1 of 20</div>
    </div>
    <div class="quiz-wrapper">
      <h2>Part 1: Personality Analysis</h2>

      <div class="separator"></div>

      <h4 id="question-text" class="text-center fw-semibold"></h4>

      <div class="options-row btn-group">
        <button class="answer-btn" data-value="1">
          1<br />Strongly Disagree
        </button>
        <button class="answer-btn" data-value="2">2<br />Disagree</button>
        <button class="answer-btn" data-value="3">3<br />Neutral</button>
        <button class="answer-btn" data-value="4">4<br />Agree</button>
        <button class="answer-btn" data-value="5">5<br />Strongly Agree</button>
      </div>

      <div class="nav-buttons">
        <button id="prev-btn" class="btn-prev">← Previous</button>
        <button
          id="saveProgressBtn"
          class="btn btn-outline-secondary rounded-pill px-4"
        >
          <i class="fas fa-save me-1"></i> Save Progress
        </button>

        <button id="next-btn" class="btn-next">Next Question →</button>
      </div>
    </div>

    <script src="part1_logic.js"></script>
    <script>
      // ====== SAVE PROGRESS BUTTON HANDLER ======
      // Saves the student's progress whenever they click "Save Progress"
      // Sends ALL answered questions (1 to current), not just the current one
      document
        .getElementById("saveProgressBtn")
        .addEventListener("click", async () => {
          // Collect all answered questions from index 0 up to currentQuestion
          const answers = [];

          for (let i = 0; i <= currentQuestion; i++) {
            // Skip questions that haven't been answered yet
            if (
              selectedAnswers[i] !== null &&
              selectedAnswers[i] !== undefined
            ) {
              const q = questions[i];
              if (q) {
                // Each answer: {question_id, selected_option}
                answers.push({
                  question_id: q.question_id,
                  selected_option: selectedAnswers[i],
                });
              }
            }
          }

          // Validate: at least one answer was selected
          if (answers.length === 0) {
            alert(
              "Please select an answer for at least one question before saving."
            );
            return;
          }

          // Build payload to send to backend
          const payload = {
            part: 1,
            current_question_number: currentQuestion + 1, // Last answered question
            answers: answers, // Array of all answered questions
          };

          try {
            // Send to backend save_progress.php
            const res = await fetch("./php/student/save_progress.php", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify(payload),
            });

            const data = await res.json();

            if (data.success) {
              alert("Progress saved successfully ✅");
            } else {
              alert("Failed to save progress ❌");
            }
          } catch (err) {
            console.error(err);
            alert("Server error ❌");
          }
        });
    </script>
  </body>
</html>
